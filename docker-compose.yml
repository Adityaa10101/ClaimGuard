# ──────────────────────────────────────────────────────────
# ClaimGuard — Docker Compose Stack
# ──────────────────────────────────────────────────────────
# Two services sharing the same image, same source, same engine.
#
# Usage:
#   docker compose build
#   docker compose up -d
#   docker compose ps
#   docker compose down
#
# URLs:
#   API:     http://localhost:8000
#   Swagger: http://localhost:8000/docs
#   UI:      http://localhost:8501
# ──────────────────────────────────────────────────────────

services:
  # ── FastAPI API Service ──────────────────────────────────
  api:
    build: .
    container_name: claimguard-api
    command: >
      python -m uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CLAIMGUARD_ALLOWED_ORIGINS=${CLAIMGUARD_ALLOWED_ORIGINS:-http://localhost:8501,http://localhost:3000,http://localhost:8000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - claimguard-net
    restart: unless-stopped

  # ── Streamlit UI Service ─────────────────────────────────
  ui:
    build: .
    container_name: claimguard-ui
    command: >
      streamlit run app.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.headless true
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    networks:
      - claimguard-net
    restart: unless-stopped

networks:
  claimguard-net:
    driver: bridge
